services:
  - type: web
    name: solidar-bairro-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
      - key: FIREBASE_CLIENT_X509_CERT_URL
        sync: false
      - key: FRONTEND_URL
        value: https://solidarbrasil.com.br
      - key: REDIS_ENABLED
        value: false
      - key: CACHE_TTL
        value: 3600
      - key: RATE_LIMIT_WINDOW
        value: 15
      - key: RATE_LIMIT_MAX
        value: 1000
      - key: ADDRESS_RATE_LIMIT_MAX
        value: 500
      - key: LOG_LEVEL
        value: info
      - key: VIACEP_TIMEOUT
        value: 5000
      - key: FALLBACK_API_ENABLED
        value: true
